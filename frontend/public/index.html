<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MediHelp — Prescription Scanner (Prototype)</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <h1>MediHelp <span>prototype</span></h1>
    <p class="subtitle">Upload or photograph a prescription to get a list of medicines.</p>

    <!-- Works on Android: opens native camera app directly -->
    <input type="file" id="fileInput" accept="image/*" capture="environment" hidden />

    <div class="button-row">
      <button id="chooseBtn" class="btn">📁 Upload / Take Photo</button>
      <button id="webcamBtn" class="btn btn-secondary">🎥 Use Webcam (Windows)</button>
    </div>

    <!-- Live webcam view, hidden until "Use Webcam" is clicked -->
    <div id="webcamWrap" class="hidden">
      <video id="webcamVideo" autoplay playsinline></video>
      <button id="captureBtn" class="btn">📸 Capture</button>
      <button id="closeWebcamBtn" class="btn btn-secondary">Cancel</button>
    </div>

    <canvas id="canvas" class="hidden"></canvas>

    <div id="previewWrap" class="hidden">
      <h3>Preview</h3>
      <img id="previewImg" alt="Prescription preview" />
      <button id="analyzeBtn" class="btn">🔎 Analyze Prescription</button>
    </div>

    <div id="status"></div>

    <section id="resultsWrap" class="hidden">
      <h3>Detected Medicines</h3>
      <ul id="resultsList"></ul>
      <p id="notesText" class="notes"></p>
    </section>
  </main>

  <script src="camera.js"></script>
  <script src="api.js"></script>
  <script src="main.js"></script>
</body>
</html>
